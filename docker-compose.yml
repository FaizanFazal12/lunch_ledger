services:
  db:
    image: postgres:16-alpine
    container_name: lunchledger-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lunchledger
      POSTGRES_PASSWORD: lunchledger
      POSTGRES_DB: lunchledger
    ports:
      # Host 5433 -> container 5432, to avoid clashing with a local Postgres on 5432
      - "5433:5432"
    volumes:
      - lunchledger_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunchledger -d lunchledger"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lunchledger_pgdata:
